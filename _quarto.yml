project:
  type: website
  output-dir: .

website:
  title: "Yu-You Liou 劉昱佑"
  site-url: https://yyliou.github.io
  favicon: icon.png
  open-graph: true
  twitter-card: true
  image: pic.png
  search: false
  description: "Yu-You Liou (劉昱佑) — Ph.D. Candidate at National Taiwan University and Adjunct Lecturer at Shih Chien University. Research in environmental economics and natural resource management, transportation economics and traffic safety, agricultural economics, land and housing markets, and applied microeconometrics and causal inference."
  navbar:
    title: "Liou"
    left:
      - href: about.qmd
        text: About
      - href: research.qmd
        text: Research
      - href: teach.qmd
        text: Teaching
      - href: https://yyliou.github.io/yyliou/cv/cv_metrics.pdf
        text: CV
        target: _blank

format:
  html:
    theme:
      - cosmo
    css: styles.css
    toc: false
    # Site pages open in place; PDFs and other sites open in a new tab.
    # Character classes instead of backslashes: Quarto copies the pattern into a JS string.
    link-external-newwindow: true
    link-external-icon: false
    link-external-filter: '^https?://yyliou[.]github[.]io/?(?:[A-Za-z0-9_-]+[.]html)?(?:[?#].*)?$'
    include-in-header: _header.html
    include-after-body: _footer.html

lang: en

editor: source

